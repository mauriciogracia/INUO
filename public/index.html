<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iNoU Platform — Web UI</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <!-- Header Bar -->
      <header class="top-header">
        <div class="brand">
          <div class="logo-badge">iNoU</div>
          <div class="title-group">
            <h1>iNoU Interaction Engine</h1>
            <span class="version-tag" id="system-version">v00.02.95</span>
          </div>
        </div>

        <div class="status-pills">
          <div class="pill mode-pill">
            <span class="pill-label" id="label-mode">Modo:</span>
            <select id="mode-select" class="mode-dropdown">
              <option value="promptMe" selected>Modo Directo</option>
              <option value="letMeServeYou">Modo Servicio</option>
            </select>
          </div>

          <div class="pill succinct-pill">
            <span class="pill-label" id="label-succinct">Conciso:</span>
            <span class="pill-value badge-on" id="status-succinct">ON</span>
          </div>

          <div class="pill debug-pill">
            <span class="pill-label" id="label-debug">Nivel:</span>
            <span class="pill-value" id="status-debug">Level 3</span>
          </div>
        </div>
      </header>

      <!-- Viewport Navigation Tabs -->
      <nav class="view-tabs">
        <button class="tab-btn active" data-tab="conversation">
          <span id="tab-main">💬 Conversación</span>
        </button>
        <button class="tab-btn" data-tab="thinking">
          <span id="tab-thinking">🧠 Pensando</span>
          <span class="tab-badge" id="badge-thinking">0</span>
        </button>
        <button class="tab-btn" data-tab="debug">
          <span id="tab-debug">⚙ Depuración</span>
          <span class="tab-badge" id="badge-debug">0</span>
        </button>
      </nav>

      <!-- Main Live Log Stream Window -->
      <main class="log-viewport" id="log-viewport">
        <div class="log-entry system-msg">
          <span class="log-time">[System]</span>
          <span id="system-connected-msg" class="log-text"
            >🚀 iNoU conectado. Flujo SSE en tiempo real activo.</span
          >
        </div>
      </main>

      <!-- Pinned Bottom Input Bar -->
      <footer class="bottom-input-bar">
        <form id="command-form" class="input-form">
          <div class="prompt-prefix">iNoU &gt;</div>
          <input
            type="text"
            id="command-input"
            class="cmd-input"
            placeholder="Hola · Hello · Bonjour · Hallo · Olá"
            autocomplete="off"
            autofocus
          />
          <button type="submit" class="send-btn" id="send-btn">
            <span id="send-btn-text">Enviar</span>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </form>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
